---
layout: default
---

<!--
    This layout generates a catalog, which lists out all Codex pages of a certain topic.

    The instances of this layout are not manually created. Instead, they will be automatically generated.
-->

{% assign db = site.data['codex'] %}

{% assign slugs = db['branches_by_id'][page.branch_id]['topics_by_id'][page.topic_id]['slugs'] %}

<ul class="post-listing">
    {% for slug in slugs %}
        {% assign p = db['pages_by_slug'][slug] %}

        <li>
            <a style="margin-right: auto" href="{{ p.url }}">{{ p.title }}</a>
            <span style="font-family: var(--font-m)">{{ slug }}</span>
        </li>
    {% endfor %}
</ul>
