---
layout: default
---

{% assign db = site.data['codex'] %}

{% assign slugs = db['chapters'][page.chapter_id]['slugs'] %}

<ul class="post-listing">
    {% for slug in slugs %}
        {% assign p = db['pages'][slug] %}

        <li>
            <a style="margin-right: auto" href="{{ p.url }}">{{ p.title }}</a>
            <span>{{ slug }}</span>
        </li>
    {% endfor %}
</ul>
