# The Codex database.
#
# `branches` contains the sorted list of all branches.
#
# Based on this list, CodexGenerator will also generate two other hashes:
#
#   `branches_by_id` - Hash of all branches indexed by their IDs.
#   `pages_by_slug`  - Hash of all pages indexed by their slugs.

branches:

  - id:   set-theory
    name: "Set Theory"
    topics:

      - id:    basics
        name:  "Basics"
        slugs: [ CLS, V, ZF, AC, EMP, BLD, SUB, PAIR, U, SING, ROST, ITSC, DJ, DJU, SD, DMG, SYMD,
                 P, TUP, X ]

      - id:    relations
        name:  "Relations"
        slugs: [ REL, ID, RELC, EQV, CONV, COMP, RST, IM ]

      - id:    functions
        name:  "Functions"
        slugs: [ F, OPC, INJ, SUR, BIJ, INVF, HOM, INVO, ADST ]

      - id:    orders
        name:  "Orders"
        slugs: [ PRO, TPRO, PO, TO, OH, MAXL, GR, MAX, BND, SUP, DDKC, WO, WF ]

      - id:    ordinals
        name:  "Ordinals"
        slugs: [ TRAN, ORD, OT, SUC, INDS, LIMO, FINO, FIN, CNT, IND, TIND, TSQ, OSQL, COSQ, NOSQ,
                 TREC, OAR ]

      - id:    cardinals
        name:  "Cardinals"
        slugs: [ EQN, CARD, CSUC, ALF, CTY, CAR, SSUB ]

  - id:   abstract-algebra
    name: "Abstract Algebra"
    topics:

      - id:    magmas
        name:  "Magmas"
        slugs: [ MAG, SMAG, MAGH, MAGO, NEU, INV, ABSB, CO ]

      - id:    semigroups
        name:  "Semigroups"
        slugs: [ SEMG, SSEMG, SEMGH ]

      - id:    monoids
        name:  "Monoids"
        slugs: [ MOID, SMOID, MOIDH ]

      - id:    groups
        name:  "Groups"
        slugs: [ G, SG, GH, GDP, CONJ, IDX, LAG, NSG, QG, GEN, PRD, SYMG, CAY, PAR, ALTG, OG ]

      - id:    rings
        name:  "Rings"
        slugs: [ RING, SRING, RINGH, ORING, RDP, BI, FRING, ZD, DOM, IDOM, CHAR ]

      - id:    fields
        name:  "Fields"
        slugs: [ FLD, SFLD, FLDH, OFLD, FRAC ]

      - id:    number-systems
        name:  "Number Systems"
        slugs: [ N, Z, Q, R ]

      - id:    polynoms
        name:  "Polynoms"
        slugs: [ POW, POLY, QEXP ]

      - id:    misc
        name:  "Misc"
        slugs: [ IVERB, KROND ]

  - id:   linear-algebra
    name: "Linear Algebra"
    topics:

      - id:    vector-spaces
        name:  "Vector Spaces"
        slugs: [ MOD, VS, SVS, SP, LD, BAS, DIM, VSSUM, VSDS, AFF ]

      - id:    matrices
        name:  "Matrices"
        slugs: [ M ]

      - id:    linear-functions
        name:  "Linear Functions"
        slugs: [ LF, LRK, LNUL, RKNUL ]

  - id:   topology
    name: "Topology"
    topics:

      - id:    basics
        name:  "Basics"
        slugs: [ MET, SNOR, NOR, DIAM, BNDF, SUPNOR, BALL, ITR, OPN, CLO ]

  - id:   number-theory
    name: "Number Theory"
    topics:

      - id:    divisibility
        name:  "Divisibility"
        slugs: [ DIV, EVEN ]

  - id:   combinatorics
    name: "Combinatorics"
    topics:

      - id:    enumerations
        name:  "Enumerations"
        slugs: [ FAC, PERM, COMB ]
