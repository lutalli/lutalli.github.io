# This is the Codex database.
#
# Alongside the hash `chapters`, CodexGenerator from `_plugins/gen.rb` will also generate another
# hash called `pages`, which contains all the pages indexed by slugs. We can then access the pages
# directly by slug:
#
#     page = site.data['codex']['pages'][slug]
#
# Without this, we would have to iterate over the whole collection until we find the page that
# matches the desired slug. Apparently, Jekyll doesn't provide any means to access a page even if
# we know its full file path.   :shrug:
#
# NOTE: Even though `chapters` is a hash, which is not ordered in theory, but in practice the order
# is preserved. Iterating both in Ruby and Liquid gives the right ordering. That means the order
# of the chapters is already included in this file!

chapters:

  set-theory-basics:
    name:  "Set Theory Basics"
    slugs: [ CLS, V, ZF, AC, EMP, BLD, SUB, PAIR, U, SING, ROST, ITSC, DJ, DJU, SD, DMG, SYMD, P,
             TUP, X ]

  relations:
    name:  "Relations"
    slugs: [ REL, INVR, COMP, RST, IM, ID, REF, SYM, TRA, CON, UNI, TOT, EQV ]

  functions:
    name:  "Functions"
    slugs: [ F, OP, INJ, SUR, BIJ, INVF, CL, IDP, COM, ASS, CAN, DST, ADST, INVO, HOM ]

  orders:
    name:  "Orders"
    slugs: [ PRO, TPRO, PO, TO, OH, MAXL, GR, MAX, BND, SUP, DDKC, WO, WF ]

  ordinals:
